<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#160d31">
  <title>남양주시장애인복지관 20주년 키오스크</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main id="kioskShell" class="kiosk-shell">
    <section id="attractScreen" class="attract-screen" aria-label="20주년 행사 키오스크 초기화면">
      <div class="attract-backdrop"></div>

      <div class="poster-stage">
        <div class="kiosk-media-frame">
          <video id="kioskIntroVideo" class="kiosk-intro-video"
            src="../assets/intro_mobile.mp4"
            poster="../assets/kiosk_20th_poster.png"
            autoplay muted loop playsinline preload="auto"
            aria-label="남양주시장애인복지관 20주년 인트로 영상"></video>
          <img id="kioskPosterFallback" class="poster-image kiosk-poster-fallback hidden"
            src="../assets/kiosk_20th_poster.png"
            alt="남양주시장애인복지관 개관 20주년 행사 포스터">
          <div class="media-touch-hint"><span>화면을 터치해 주세요</span></div>
        </div>
      </div>

      <div class="touch-panel">
        <p class="touch-kicker">20TH ANNIVERSARY INVITATION</p>
        <h1>남양주시장애인복지관<br>개관 20주년 기념행사</h1>
        <p class="touch-guide">20주년 인트로 영상을 터치하면 행사 안내와 참가 신청을 확인할 수 있습니다.</p>

        <button id="openInvitationButton" class="touch-start-button" type="button">
          <span class="touch-icon">☝</span>
          <span class="touch-button-copy">
            <strong>초대장 · 참가신청</strong>
            <small>여기를 터치해 주세요</small>
          </span>
          <b>→</b>
        </button>
      </div>

      <button id="posterTapArea" class="poster-tap-area" type="button" aria-label="포스터를 눌러 초대장 열기"></button>
    </section>

    <section id="contentScreen" class="content-screen hidden" aria-label="모바일 초대장 및 참가신청">
      <header class="kiosk-toolbar">
        <button id="homeButton" class="kiosk-home-button" type="button">← 처음 화면으로</button>
        <div class="kiosk-toolbar-copy">
          <strong>20주년 모바일 초대장 · 참가신청</strong>
          <span>화면을 조작하면 대기시간이 다시 1분으로 연장됩니다.</span>
        </div>
        <div class="idle-box">
          <small>자동 초기화</small>
          <strong><span id="idleSeconds">60</span>초</strong>
        </div>
      </header>

      <div class="iframe-shell">
        <iframe
          id="invitationFrame"
          title="남양주시장애인복지관 20주년 모바일 초대장"
          src="about:blank"
          allow="camera; clipboard-write"
        ></iframe>
      </div>

      <div id="idleWarning" class="idle-warning hidden" role="status">
        <strong>잠시 후 처음 화면으로 돌아갑니다.</strong>
        <span>계속 이용하시려면 화면을 터치해 주세요.</span>
      </div>
    </section>
  </main>

  <script src="kiosk.js?v=1"></script>
</body>
</html>
