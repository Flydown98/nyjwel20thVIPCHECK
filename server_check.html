<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>20주년 QR 시스템 · 서버 연결 진단</title>
<style>
body{font-family:"Pretendard","Malgun Gothic",sans-serif;margin:0;background:#f5f7fb;color:#1f2937}
main{width:min(850px,calc(100% - 28px));margin:30px auto;padding:26px;background:#fff;border:1px solid #d9e0ea;border-radius:20px}
.row{display:grid;grid-template-columns:190px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f4}
.status{font-weight:800}.ok{color:#178b51}.warn{color:#a15c00}.fail{color:#b42318}
button{margin-top:16px;padding:12px 16px;border:0;border-radius:11px;background:#101a38;color:#fff;font-weight:900}
.log{margin-top:18px;padding:14px;border-radius:12px;background:#0e162b;color:#dce6fb;font:12px/1.65 Consolas,monospace;white-space:pre-wrap}
.note{margin-top:18px;padding:14px;background:#fff9e8;border:1px solid #edd18b;border-radius:12px;line-height:1.6}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
<h1>Apps Script 서버 연결 진단</h1>
<p>health, 공개 GET, 개인정보용 POST bridge를 각각 따로 측정합니다.</p>
<div class="row"><b>GET health</b><span id="health" class="status">대기</span></div>
<div class="row"><b>서버 버전</b><span id="version" class="status">대기</span></div>
<div class="row"><b>publicBootstrap 직접 GET</b><span id="bootstrap" class="status">대기</span></div>
<div class="row"><b>POST bridge</b><span id="bridge" class="status">대기</span></div>
<button id="run">다시 진단</button>
<div id="log" class="log">준비</div>
<div class="note">
<b>참고</b><br>
Apps Script bridge는 POST 실행 1회 + 결과 polling GET 실행이 추가되어 직접 GET보다 느릴 수 있습니다.
첫 요청은 Google 측 콜드 스타트 때문에 2~4초 이상 튈 수 있습니다.
이 페이지는 더 이상 예전 7.5.0을 정상 버전으로 고정하지 않습니다.
</div>
</main>
<script>
(()=>{
 const API=String(window.NYJ20_CONFIG?.appsScriptUrl||'').trim(),$=id=>document.getElementById(id);
 const log=m=>{$('log').textContent+=`\\n[${new Date().toLocaleTimeString()}] ${m}`};
 const set=(id,t,k='')=>{$(id).textContent=t;$(id).className='status '+k};
 const cb=()=>`__diag_${Date.now()}_${Math.random().toString(36).slice(2)}`;
 function jsonp(url,timeout=15000){return new Promise((res,rej)=>{const c=cb(),s=document.createElement('script'),timer=setTimeout(()=>done(new Error('timeout')),timeout);function done(e,d){clearTimeout(timer);s.remove();try{delete window[c]}catch(_){ }e?rej(e):res(d)}window[c]=d=>done(null,d);s.onerror=()=>done(new Error('load fail'));const u=new URL(url);u.searchParams.set('callback',c);u.searchParams.set('_',Date.now());s.src=u;document.head.appendChild(s)})}
 async function direct(action){const u=new URL(API);u.searchParams.set('action',action);const st=performance.now(),r=await jsonp(u);return{r,ms:Math.round(performance.now()-st)}}
 function bridge(action,payload={}){return new Promise((res,rej)=>{const requestId='diag_'+Date.now()+'_'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2),iframe=document.createElement('iframe'),form=document.createElement('form');iframe.name='f_'+Date.now();iframe.style.display='none';form.method='POST';form.action=API;form.target=iframe.name;form.style.display='none';for(const[k,v]of Object.entries({bridge:'1',requestId,action,payload:JSON.stringify(payload)})){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i)}document.body.append(iframe,form);const deadline=Date.now()+25000;async function poll(){if(Date.now()>deadline){cleanup();return rej(new Error('25초 초과'))}try{const u=new URL(API);u.searchParams.set('action','bridgePoll');u.searchParams.set('requestId',requestId);const r=await jsonp(u,5000);if(r?.pending===true)return setTimeout(poll,180);cleanup();r?.ok?res(r.data):rej(new Error(r?.error||'bridge 오류'))}catch(_){setTimeout(poll,300)}}function cleanup(){form.remove();setTimeout(()=>iframe.remove(),40)}form.submit();setTimeout(poll,120)})}
 async function run(){
   $('log').textContent='진단 시작';
   try{
     let x=await direct('health'); const ver=String(x.r?.data?.version||x.r?.version||'확인불가');
     set('health',`성공 (${x.ms}ms)`,'ok');set('version',ver,'ok');log(`health ${x.ms}ms / ${ver}`);
   }catch(e){set('health','실패 '+e.message,'fail');return}
   try{
     let x=await direct('publicBootstrap');set('bootstrap',`성공 (${x.ms}ms)`,'ok');log(`publicBootstrap GET ${x.ms}ms`);
   }catch(e){set('bootstrap','실패 '+e.message,'fail')}
   try{
     const st=performance.now();await bridge('publicBootstrap',{});const ms=Math.round(performance.now()-st);
     set('bridge',`성공 (${ms}ms)`,'ok');log(`bridge/publicBootstrap ${ms}ms`);
   }catch(e){set('bridge','실패 '+e.message,'fail')}
 }
 $('run').onclick=run;run();
})();
</script>
</body></html>
